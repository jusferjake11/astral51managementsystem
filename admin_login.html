<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODM Scrim · Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #020617 0%, #020617 45%, #000 100%);
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: radial-gradient(circle at top, #1f2933 0%, #020617 55%);
      padding: 24px 22px 20px;
      border-radius: 18px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 22px 55px rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.5);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      letter-spacing: 0.03em;
      color: #bfdbfe;
    }

    .subtitle {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 16px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid rgba(55, 65, 81, 0.8);
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: #9ca3af;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: #3b82f6;
      color: #0b0f14;
      box-shadow: 0 6px 18px rgba(59, 130, 246, 0.45);
    }

    .form-panel {
      display: none;
      text-align: left;
    }

    .form-panel.active {
      display: block;
    }

    .field-label {
      display: block;
      font-size: 11px;
      color: #9ca3af;
      margin: 0 0 4px 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .input {
      width: 100%;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.8);
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
      margin: 0 0 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }

    .input::placeholder {
      color: #6b7280;
    }

    .input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.55), 0 10px 30px rgba(15, 23, 42, 0.7);
      background: rgba(15, 23, 42, 1);
      transform: translateY(-1px);
    }

    .message {
      font-size: 12px;
      min-height: 16px;
      margin-bottom: 8px;
      text-align: center;
    }

    .message.error {
      color: #fecaca;
    }

    .message.success {
      color: #bbf7d0;
    }

    .message.info {
      color: #fde68a;
    }

    .btn {
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      padding: 9px 16px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-primary {
      background: #3b82f6;
      color: #0b0f14;
    }

    .btn-primary:hover:not(:disabled) {
      background: #2563eb;
      transform: translateY(-1px);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.5);
    }

    .divider {
      margin: 18px 0 14px;
      border-top: 1px solid rgba(55, 65, 81, 0.8);
      position: relative;
    }

    .divider span {
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      padding: 0 10px;
      font-size: 10px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .admin-section {
      text-align: left;
    }

    .admin-section .subtitle {
      margin-bottom: 10px;
      text-align: center;
    }

    .admin-toggle {
      background: transparent;
      border: none;
      color: #93c5fd;
      font-size: 11px;
      cursor: pointer;
      padding: 0;
      margin-top: 8px;
      width: 100%;
      text-align: center;
    }

    .admin-toggle:hover {
      color: #bfdbfe;
      text-decoration: underline;
    }

    #adminPanel {
      display: none;
      margin-top: 10px;
    }

    #adminPanel.visible {
      display: block;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <h1>CODM Scrim Portal</h1>
    <div class="subtitle">Sign in to your account or create a new one.</div>

    <div class="tabs">
      <button type="button" id="tabLogin" class="tab-btn active">Login</button>
      <button type="button" id="tabRegister" class="tab-btn">Create Account</button>
    </div>

    <!-- Account Type Tabs (for register only) -->
    <div id="accountTypeTabs" class="tabs" style="margin-bottom: 12px; background: transparent; border: none; padding: 0; display: none;">
      <button type="button" id="acctUser" class="tab-btn active" style="font-size: 11px;">👤 Admin</button>
      <button type="button" id="acctClan" class="tab-btn" style="font-size: 11px;">🛡️ Clan</button>
    </div>

    <!-- LOGIN -->
    <div id="loginPanel" class="form-panel active">
      <label class="field-label" for="loginUser">Username or Email</label>
      <input type="text" id="loginUser" class="input" placeholder="Enter username or email" autocomplete="username">
      <label class="field-label" for="loginPass">Password</label>
      <input type="password" id="loginPass" class="input" placeholder="Enter password" autocomplete="current-password">
      <label class="field-label" for="loginRoleSelect" style="margin-top:10px;">Login As</label>
      <select id="loginRoleSelect" class="input" style="appearance:auto; cursor:pointer; color:#e2e8f0; background:#1e293b; border:1px solid rgba(99,102,241,0.35);">
        <option value="admin">👤 Admin</option>
        <option value="clan">🛡️ Clan</option>
      </select>
      <div id="loginMsg" class="message"></div>
      <button type="button" id="loginBtn" class="btn btn-primary">Sign In</button>
    </div>

    <!-- REGISTER - USER -->
    <div id="registerUserPanel" class="form-panel">
      <label class="field-label" for="regUsername">Username</label>
      <input type="text" id="regUsername" class="input" placeholder="Choose a username" autocomplete="username">
      <label class="field-label" for="regEmail">Email Address</label>
      <input type="email" id="regEmail" class="input" placeholder="you@example.com" autocomplete="email">
      <label class="field-label" for="regPass">Password</label>
      <input type="password" id="regPass" class="input" placeholder="Create a password" autocomplete="new-password">
      <label class="field-label" for="regConfirm">Confirm Password</label>
      <input type="password" id="regConfirm" class="input" placeholder="Re-enter password" autocomplete="new-password">
      <div id="registerMsg" class="message"></div>
      <button type="button" id="registerBtn" class="btn btn-primary">Create Account</button>
    </div>

    <!-- REGISTER - CLAN -->
    <div id="registerClanPanel" class="form-panel">
      <label class="field-label" for="regClanTag">Clan Tag <span style="color:#fca5a5;">*</span></label>
      <input type="text" id="regClanTag" class="input" placeholder="e.g. A51, ZRM, DTX" maxlength="10" style="text-transform:uppercase;">
      <label class="field-label" for="regClanName">Full Clan Name <span style="color:#fca5a5;">*</span></label>
      <input type="text" id="regClanName" class="input" placeholder="e.g. ASTRAL 51 ELITE">
      <label class="field-label" for="regClanLeader">CLAN HANDLER NAME <span style="color:#fca5a5;">*</span></label>
      <input type="text" id="regClanLeader" class="input" placeholder="Name of the person handling clan operations">
      <label class="field-label" for="regClanUsername">Clan Login Username <span style="color:#fca5a5;">*</span></label>
      <input type="text" id="regClanUsername" class="input" placeholder="Username for your clan account">
      <label class="field-label" for="regClanPass">Password <span style="color:#fca5a5;">*</span></label>
      <input type="password" id="regClanPass" class="input" placeholder="Create a password (min 6 chars)" autocomplete="new-password">
      <label class="field-label" for="regClanConfirm">Confirm Password <span style="color:#fca5a5;">*</span></label>
      <input type="password" id="regClanConfirm" class="input" placeholder="Re-enter password" autocomplete="new-password">
      <div id="registerClanMsg" class="message"></div>
      <div style="font-size: 10px; color:#94a3b8; margin-bottom: 10px; text-align:center; line-height:1.4;">
        ⚠️ Your clan must be on the CLAN LIST to reserve slots. Admin approval required.
      </div>
      <button type="button" id="registerClanBtn" class="btn btn-primary" style="background: linear-gradient(135deg, #8b5cf6, #6366f1);">🛡️ Create Clan Account</button>
    </div>

    <div class="divider"><span>Admin Access</span></div>

    <div class="admin-section">
      <button type="button" id="adminToggle" class="admin-toggle">Admin login with key →</button>
      <div id="adminPanel">
        <input type="password" id="adminKey" class="input" placeholder="Admin key">
        <div id="adminMsg" class="message"></div>
        <button type="button" id="adminLoginBtn" class="btn btn-primary">Continue as Admin</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yzdtszfubnastllfyczs.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6ZHRzemZ1Ym5hc3RsbGZ5Y3pzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIwNzEyOTgsImV4cCI6MjA4NzY0NzI5OH0.GJz1ouXTbi3GQZYJa0756w4CgqabT9C2EH_mW_m_5TY';
    const USERS_CONFIG_KEY = 'app_users';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const acctUser = document.getElementById('acctUser');
    const acctClan = document.getElementById('acctClan');
    const loginPanel = document.getElementById('loginPanel');
    const registerUserPanel = document.getElementById('registerUserPanel');
    const registerClanPanel = document.getElementById('registerClanPanel');
    const loginMsg = document.getElementById('loginMsg');
    const registerMsg = document.getElementById('registerMsg');
    const registerClanMsg = document.getElementById('registerClanMsg');
    const adminMsg = document.getElementById('adminMsg');
    const CLANS_CONFIG_KEY = 'app_clans';
    let currentAccountType = 'user';

    function setMsg(el, text, type) {
      el.textContent = text || '';
      el.className = 'message' + (type ? ' ' + type : '');
    }

    function switchTab(tab) {
      const isLogin = tab === 'login';
      tabLogin.classList.toggle('active', isLogin);
      tabRegister.classList.toggle('active', !isLogin);
      loginPanel.classList.toggle('active', isLogin);
      // Show account type tabs only on Register tab
      document.getElementById('accountTypeTabs').style.display = isLogin ? 'none' : 'flex';
      if (!isLogin) {
        switchAccountType(currentAccountType);
      } else {
        registerUserPanel.classList.remove('active');
        registerClanPanel.classList.remove('active');
      }
      setMsg(loginMsg, '');
      setMsg(registerMsg, '');
      setMsg(registerClanMsg, '');
    }

    function switchAccountType(type) {
      currentAccountType = type;
      acctUser.classList.toggle('active', type === 'user');
      acctClan.classList.toggle('active', type === 'clan');
      const isLogin = tabLogin.classList.contains('active');
      if (!isLogin) {
        registerUserPanel.classList.toggle('active', type === 'user');
        registerClanPanel.classList.toggle('active', type === 'clan');
      }
      setMsg(registerMsg, '');
      setMsg(registerClanMsg, '');
    }

    tabLogin.onclick = () => switchTab('login');
    tabRegister.onclick = () => switchTab('register');
    acctUser.onclick = () => switchAccountType('user');
    acctClan.onclick = () => switchAccountType('clan');

    document.getElementById('adminToggle').onclick = () => {
      document.getElementById('adminPanel').classList.toggle('visible');
    };

    async function hashPassword(password) {
      const data = new TextEncoder().encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function normalize(str) {
      return (str || '').toString().trim().toLowerCase();
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    async function fetchUsers() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/config?key=eq.${USERS_CONFIG_KEY}&select=value`, {
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
      });
      const data = await res.json();
      if (!data || !data.length || !data[0].value) return [];
      try {
        const parsed = JSON.parse(data[0].value);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    async function saveUsers(users) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/config`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          Prefer: 'resolution=merge-duplicates, return=minimal',
        },
        body: JSON.stringify({ key: USERS_CONFIG_KEY, value: JSON.stringify(users) }),
      });
      return res.ok;
    }

    function setUserSession(user, accountType = 'user') {
      sessionStorage.setItem('codmUserAuth', '1');
      sessionStorage.setItem('codmUserId', user.id);
      sessionStorage.setItem('codmUsername', user.username);
      sessionStorage.setItem('codmUserEmail', user.email || '');
      sessionStorage.setItem('codmUserStatus', user.status);
      sessionStorage.setItem('codmUserRole', accountType);
      sessionStorage.setItem('codmAccountType', accountType);
      if (accountType === 'clan') {
        sessionStorage.setItem('codmClanTag', user.clan_tag || '');
        sessionStorage.setItem('codmClanName', user.clan_name || '');
        sessionStorage.setItem('codmClanApproved', (user.clan_approved === true || user.clan_approved === 'true') ? 'true' : 'false');
      } else {
        sessionStorage.removeItem('codmClanTag');
        sessionStorage.removeItem('codmClanName');
        sessionStorage.removeItem('codmClanApproved');
      }
    }

    async function fetchClans() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/config?key=eq.${CLANS_CONFIG_KEY}&select=value`, {
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
      });
      const data = await res.json();
      if (!data || !data.length || !data[0].value) return [];
      try {
        const parsed = JSON.parse(data[0].value);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    async function saveClans(clans) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/config`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          Prefer: 'resolution=merge-duplicates, return=minimal',
        },
        body: JSON.stringify({ key: CLANS_CONFIG_KEY, value: JSON.stringify(clans) }),
      });
      return res.ok;
    }

    // --- USER LOGIN ---
    async function doUserLogin() {
      const identifier = normalize(document.getElementById('loginUser').value);
      const password = document.getElementById('loginPass').value;
      const roleSelect = document.getElementById('loginRoleSelect');
      const selectedRole = roleSelect ? roleSelect.value : 'admin';
      const btn = document.getElementById('loginBtn');

      if (!identifier || !password) {
        setMsg(loginMsg, 'Please enter your username/email and password.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in...';
      setMsg(loginMsg, '');

      try {
        let user = null;
        let accountType = selectedRole === 'clan' ? 'clan' : 'user';

        if (selectedRole === 'clan') {
          // Only search clan accounts
          const clans = await fetchClans();
          user = clans.find(c =>
            normalize(c.username) === identifier || normalize(c.email) === identifier
          );
          if (!user) {
            setMsg(loginMsg, 'Clan account not found. Check your credentials.', 'error');
            return;
          }
        } else {
          // Only search admin/user accounts
          const users = await fetchUsers();
          user = users.find(u =>
            normalize(u.username) === identifier || normalize(u.email) === identifier
          );
          if (!user) {
            setMsg(loginMsg, 'Admin account not found. Check your credentials.', 'error');
            return;
          }
        }

        const hash = await hashPassword(password);
        if (user.password !== hash) {
          setMsg(loginMsg, 'Incorrect password.', 'error');
          return;
        }

        const status = (user.status || 'pending approval').toLowerCase();
        if (status === 'pending approval') {
          setMsg(loginMsg, accountType === 'clan'
            ? 'Your clan account is pending admin approval. Please wait for verification.'
            : 'Your account is pending approval. Please wait for an admin to activate it.', 'info');
          return;
        }
        if (status === 'inactive') {
          setMsg(loginMsg, 'Your account is inactive. Contact an admin for assistance.', 'error');
          return;
        }

        if (accountType === 'clan') {
          const approved = user.clan_approved === true || user.clan_approved === 'true';
          if (!approved) {
            setMsg(loginMsg, '⚠️ Your clan is NOT yet on the APPROVED CLAN LIST. Reservation will be restricted.', 'info');
          }
        }

        setUserSession(user, accountType);
        logActivity(`${accountType === 'clan' ? 'Clan' : 'Admin'} Login`, `${accountType === 'clan' ? 'Clan' : 'Admin'} account "${user.username}" logged in.`, 'AUTH', user.username, accountType);
        if (accountType === 'clan') {
          window.location.href = 'scrim_reservation.html';
        } else {
          window.location.href = 'user_dashboard.html';
        }
      } catch (err) {
        console.error(err);
        setMsg(loginMsg, 'Connection error. Please try again.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    // --- CLAN REGISTER ---
    async function doClanRegister() {
      const clanTag = (document.getElementById('regClanTag').value || '').trim().toUpperCase();
      const clanName = (document.getElementById('regClanName').value || '').trim();
      const leader = (document.getElementById('regClanLeader').value || '').trim();
      const username = (document.getElementById('regClanUsername').value || '').trim();
      const password = document.getElementById('regClanPass').value;
      const confirm = document.getElementById('regClanConfirm').value;
      const btn = document.getElementById('registerClanBtn');

      if (!clanTag || !clanName || !leader || !username || !password || !confirm) {
        setMsg(registerClanMsg, 'Please fill in all required (*) fields.', 'error');
        return;
      }
      if (clanTag.length < 2) {
        setMsg(registerClanMsg, 'Clan tag must be at least 2 characters.', 'error');
        return;
      }
      if (username.length < 3) {
        setMsg(registerClanMsg, 'Username must be at least 3 characters.', 'error');
        return;
      }
      if (password.length < 6) {
        setMsg(registerClanMsg, 'Password must be at least 6 characters.', 'error');
        return;
      }
      if (password !== confirm) {
        setMsg(registerClanMsg, 'Passwords do not match.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating clan account...';
      setMsg(registerClanMsg, '');

      try {
        const clans = await fetchClans();
        if (clans.some(c => normalize(c.username) === normalize(username))) {
          setMsg(registerClanMsg, 'Username is already taken.', 'error');
          return;
        }
        if (clans.some(c => normalize(c.clan_tag) === normalize(clanTag))) {
          setMsg(registerClanMsg, `Clan tag "${clanTag}" already has an account.`, 'error');
          return;
        }

        const users = await fetchUsers();
        if (users.some(u => normalize(u.username) === normalize(username))) {
          setMsg(registerClanMsg, 'Username is already in use (user list).', 'error');
          return;
        }

        const newClan = {
          id: crypto.randomUUID(),
          clan_tag: clanTag,
          clan_name: clanName,
          clan_handler: leader,
          username,
          password: await hashPassword(password),
          status: 'pending approval',
          clan_approved: false,
          account_type: 'clan',
          created_at: new Date().toISOString(),
        };

        clans.push(newClan);
        const saved = await saveClans(clans);
        if (!saved) {
          setMsg(registerClanMsg, 'Failed to create clan account. Please try again.', 'error');
          return;
        }

        logActivity('Clan Register', `New clan account registered: "${clanTag}" / "${clanName}" - Pending Approval`, 'AUTH', username, 'clan');

        setMsg(registerClanMsg, '✅ Clan account created! Pending admin approval. You will be notified once verified.', 'success');
        document.getElementById('regClanTag').value = '';
        document.getElementById('regClanName').value = '';
        document.getElementById('regClanLeader').value = '';
        document.getElementById('regClanUsername').value = '';
        document.getElementById('regClanPass').value = '';
        document.getElementById('regClanConfirm').value = '';
        setTimeout(() => { switchTab('login'); switchAccountType('clan'); }, 3000);
      } catch (err) {
        console.error(err);
        setMsg(registerClanMsg, 'Connection error. Please try again.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🛡️ Create Clan Account';
      }
    }

    async function logActivity(action, details, context = 'AUTH', actorOverride = null, roleOverride = null) {
      try {
        const actorName = actorOverride || sessionStorage.getItem('codmUsername') || 'System';
        const actorRole = roleOverride || sessionStorage.getItem('codmUserRole') || 'user';
        const newEntry = {
          id: (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)),
          timestamp: new Date().toISOString(),
          actor: actorName,
          role: actorRole,
          action: action,
          details: details,
          context: (context || 'AUTH').toUpperCase()
        };
        const res = await fetch(`${SUPABASE_URL}/rest/v1/config?key=eq.app_system_logs&select=value`, {
          headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
        });
        const data = await res.json();
        let logs = [];
        if (data && data.length > 0 && data[0].value) {
          try { logs = JSON.parse(data[0].value); } catch(e) { logs = []; }
        }
        if (!Array.isArray(logs)) logs = [];
        logs.unshift(newEntry);
        if (logs.length > 500) logs = logs.slice(0, 500);
        await fetch(`${SUPABASE_URL}/rest/v1/config`, {
          method: 'POST',
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            Prefer: 'resolution=merge-duplicates, return=minimal'
          },
          body: JSON.stringify({ key: 'app_system_logs', value: JSON.stringify(logs) })
        });
      } catch(e) {}
    }

    // --- USER REGISTER ---
    async function doRegister() {
      const username = (document.getElementById('regUsername').value || '').trim();
      const email = (document.getElementById('regEmail').value || '').trim();
      const password = document.getElementById('regPass').value;
      const confirm = document.getElementById('regConfirm').value;
      const btn = document.getElementById('registerBtn');

      if (!username || !email || !password || !confirm) {
        setMsg(registerMsg, 'Please fill in all fields.', 'error');
        return;
      }
      if (username.length < 3) {
        setMsg(registerMsg, 'Username must be at least 3 characters.', 'error');
        return;
      }
      if (!isValidEmail(email)) {
        setMsg(registerMsg, 'Please enter a valid email address.', 'error');
        return;
      }
      if (password.length < 6) {
        setMsg(registerMsg, 'Password must be at least 6 characters.', 'error');
        return;
      }
      if (password !== confirm) {
        setMsg(registerMsg, 'Passwords do not match.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account...';
      setMsg(registerMsg, '');

      try {
        const users = await fetchUsers();
        if (users.some(u => normalize(u.username) === normalize(username))) {
          setMsg(registerMsg, 'Username is already taken.', 'error');
          return;
        }
        if (users.some(u => normalize(u.email) === normalize(email))) {
          setMsg(registerMsg, 'Email is already registered.', 'error');
          return;
        }

        const newUser = {
          id: crypto.randomUUID(),
          username,
          email,
          password: await hashPassword(password),
          status: 'pending approval',
          created_at: new Date().toISOString(),
        };

        users.push(newUser);
        const saved = await saveUsers(users);
        if (!saved) {
          setMsg(registerMsg, 'Failed to create account. Please try again.', 'error');
          return;
        }

        logActivity('User Register', `New account registered: "${username}" (${email}) - Pending Approval`, 'AUTH', username, 'user');

        setMsg(registerMsg, 'Account created! Your account is pending admin approval.', 'success');
        document.getElementById('regUsername').value = '';
        document.getElementById('regEmail').value = '';
        document.getElementById('regPass').value = '';
        document.getElementById('regConfirm').value = '';
        setTimeout(() => switchTab('login'), 2000);
      } catch (err) {
        setMsg(registerMsg, 'Connection error. Please try again.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }

    // --- ADMIN LOGIN ---
    async function doAdminLogin() {
      const val = (document.getElementById('adminKey').value || '').trim();
      const btn = document.getElementById('adminLoginBtn');

      if (!val) {
        setMsg(adminMsg, 'Please enter the admin key.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Verifying...';
      setMsg(adminMsg, '');

      try {
        let isValid = (val === 'JJmabbagu11');

        if (!isValid) {
          setMsg(adminMsg, 'Incorrect admin key.', 'error');
          return;
        }
        sessionStorage.removeItem('codmUserAuth');
        sessionStorage.removeItem('codmUserId');
        sessionStorage.setItem('codmUsername', 'Admin');
        sessionStorage.setItem('codmUserEmail', 'admin@system');
        sessionStorage.setItem('codmUserStatus', 'active');
        sessionStorage.setItem('codmUserRole', 'admin');
        sessionStorage.setItem('codmAdminAuth', '1');
        logActivity('Admin Login', 'Administrator signed in with Master Key.', 'AUTH', 'Admin', 'admin');
        window.location.href = 'admin_dashboard.html';
      } catch (err) {
        setMsg(adminMsg, 'Connection error. Please try again.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Continue as Admin';
      }
    }

    document.getElementById('loginBtn').onclick = doUserLogin;
    document.getElementById('registerBtn').onclick = doRegister;
    document.getElementById('registerClanBtn').onclick = doClanRegister;
    document.getElementById('adminLoginBtn').onclick = doAdminLogin;

    document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doUserLogin(); });
    document.getElementById('regConfirm').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
    document.getElementById('regClanConfirm').addEventListener('keydown', e => { if (e.key === 'Enter') doClanRegister(); });
    document.getElementById('adminKey').addEventListener('keydown', e => { if (e.key === 'Enter') doAdminLogin(); });

    // Redirect if already logged in
    if (sessionStorage.getItem('codmAdminAuth') === '1') {
      window.location.href = 'admin_dashboard.html';
    } else if (sessionStorage.getItem('codmUserAuth') === '1' && sessionStorage.getItem('codmUserStatus') === 'active') {
      if (sessionStorage.getItem('codmAccountType') === 'clan') {
        window.location.href = 'scrim_reservation.html';
      } else {
        window.location.href = 'user_dashboard.html';
      }
    }

    setTimeout(() => document.getElementById('loginUser').focus(), 50);
  </script>
</body>
